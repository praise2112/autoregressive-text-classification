name: "emotion_full_finetune_fair"

data:
  dataset_name: "dair-ai/emotion"
  text_column: "text"
  label_column: "label"
  train_split: "train"
  test_split: "test"

model:
  model_name: "google/gemma-3-270m-it"
  trust_remote_code: false
  torch_dtype: "bfloat16"

training:
  output_dir: "./runs/emotion_full_finetune_fair"
  num_epochs: 3
  batch_size: 16
  learning_rate: 3.0e-5
  warmup_steps: 200
  logging_steps: 100
  save_steps: 500
  eval_steps: 500
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  bf16: true
  use_peft: false

template:
  template_format: "Classify the following text as one of {labels}: {text}\n{label_prefix}"
  label_prefix: "Emotion:"
  use_chat_template: true

seed: 42
wandb_project: "autoregressive_sft"